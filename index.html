<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8F8">
<title>Quo - White Saffron Documents</title>
<link rel="icon" type="image/svg+xml" href="/Quo/favicon.svg?v=2">
<link rel="shortcut icon" type="image/svg+xml" href="/Quo/favicon.svg?v=2">
<link rel="stylesheet" href="./quo-app.css?v=45">
<link rel="stylesheet" href="./quo-doc.css?v=4">
<link rel="stylesheet" href="./quo-pdf-polish.css?v=61">
<link id="quoEditorFinalStyle" rel="stylesheet" href="./quo-editor-v2.css?v=45">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="mark">Q</div>
      <div><strong>QUO</strong><small>White Saffron Documents</small></div>
    </div>
    <nav class="nav">
      <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
      <div class="nav-label">Documents</div>
      <button data-view="documents" data-filter="all"><span class="nav-icon">□</span><span>All Documents</span></button>
      <button data-view="documents" data-filter="quotation"><span class="nav-dot"></span><span>Quotations</span></button>
      <button data-view="documents" data-filter="proforma"><span class="nav-dot"></span><span>Payment Requests</span></button>
      <button data-view="documents" data-filter="invoice"><span class="nav-dot"></span><span>Invoices</span></button>
      <button data-view="documents" data-filter="receipt"><span class="nav-dot"></span><span>Payment Receipts</span></button>
      <div class="nav-label">Internal</div>
      <button data-view="supply-usage" hidden><span class="nav-icon">↳</span><span>Catering Supplies</span></button>
      <div class="nav-label">Directory</div>
      <button data-view="customers"><span class="nav-icon">○</span><span>Customers</span></button>
      <div class="nav-label">System</div>
      <button data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-footer">
      <div class="live-pill"><i></i> Supabase connected</div>
      <small>Secure login</small>
    </div>
  </aside>
  <section class="main-shell">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="top-title">
        <div class="eyebrow" id="topEyebrow">QUO</div>
        <h1 id="topTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <label class="prepared-by"><span>Prepared by</span><input id="preparedBy" placeholder="Your name"></label>
        <button class="btn primary" id="newDocBtn">+ New Document</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </section>
</div>
<div class="modal hidden" id="newDocModal" role="dialog" aria-modal="true" aria-labelledby="newDocTitle">
  <div class="modal-card small-modal">
    <div class="modal-head"><div><div class="eyebrow">CREATE</div><h2 id="newDocTitle">New Document</h2></div><button class="icon-btn" data-close-modal>×</button></div>
    <p class="muted">What would you like to create?</p>
    <div class="create-grid">
      <button data-create="quotation"><b>QT</b><span>Quotation</span><small>Prepare an offer</small></button>
      <button data-create="proforma"><b>PI</b><span>Payment Request</span><small>Request customer payment</small></button>
      <button data-create="invoice"><b>INV</b><span>Invoice</span><small>Bill a customer</small></button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden" aria-live="polite"></div>
<div id="printRoot" class="print-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="./quo-base.js?v=4"></script>
<script src="./quo-data.js?v=4"></script>
<script src="./quo-editor.js?v=29"></script>
<script src="./quo-patch.js?v=5"></script>
<script src="./quo-ui.js?v=29"></script>
<script src="./quo-numbering.js?v=12"></script>
<script src="./quo-safety.js?v=8"></script>
<script src="./quo-sales.js?v=45"></script>
<script src="./quo-neutral.js?v=10"></script>
<script src="./quo-polish.js?v=11"></script>
<script src="./quo-runtime.js?v=15"></script>
<script src="./quo-brandfix.js?v=18"></script>
<script src="./quo-clickable.js?v=19"></script>
<script src="./quo-trash.js?v=59"></script>
<script src="./quo-document-layout.js?v=43"></script>
<script src="./quo-preview-v44.js?v=47"></script>
<script src="./quo-workflow.js?v=50"></script>
<script src="./quo-convert-number.js?v=41"></script>
<script src="./quo-payments.js?v=86"></script>
<script src="./quo-core-v41.js?v=41"></script>
<script src="./quo-final-v42.js?v=60"></script>
<script src="./quo-master-v44.js?v=58"></script>
<script src="./quo-auth-v46.js?v=49"></script>
<script src="./quo-login-clean-v53.js?v=54"></script>
<script src="./quo-pdf-pagination-v64.js?v=64"></script>
<script src="./quo-production-v64.js?v=64"></script>
<script src="./quo-final-audit-v65.js?v=65"></script>
<script src="./quo-amendments-v66.js?v=66"></script>
<script src="./quo-dashboard-graph-v67.js?v=67"></script>
<script src="./quo-supply-usage-v73.js?v=77"></script>
<script src="./quo-pax-consistency-v78.js?v=85"></script>
<script src="./quo-direct-edit-v81.js?v=82"></script>
<script src="./quo-dashboard-v83.js?v=83"></script>
<script src="./quo-list-actions-v84.js?v=84"></script>
<script src="./quo-payment-method-v86.js?v=86"></script>
<script src="./quo-invoice-first-v87.js?v=87"></script>
</body>
</html>
