<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163f3a">
<title>Quo - White Saffron Documents</title>
<link rel="stylesheet" href="./quo-app.css?v=3">
<link rel="stylesheet" href="./quo-doc.css?v=3">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="mark">Q</div>
      <div><strong>QUO</strong><small>White Saffron Documents</small></div>
    </div>
    <nav class="nav">
      <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
      <div class="nav-label">Documents</div>
      <button data-view="documents" data-filter="all"><span class="nav-icon">□</span><span>All Documents</span></button>
      <button data-view="documents" data-filter="quotation"><span class="nav-dot"></span><span>Quotations</span></button>
      <button data-view="documents" data-filter="proforma"><span class="nav-dot"></span><span>Proforma Invoices</span></button>
      <button data-view="documents" data-filter="invoice"><span class="nav-dot"></span><span>Invoices</span></button>
      <button data-view="documents" data-filter="receipt"><span class="nav-dot"></span><span>Receipts</span></button>
      <div class="nav-label">Directory</div>
      <button data-view="customers"><span class="nav-icon">○</span><span>Customers</span></button>
      <div class="nav-label">System</div>
      <button data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
    </nav>
    <div class="side-footer">
      <div class="live-pill"><i></i> Supabase connected</div>
      <small>No password mode</small>
    </div>
  </aside>
  <section class="main-shell">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="top-title">
        <div class="eyebrow" id="topEyebrow">QUO</div>
        <h1 id="topTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <label class="prepared-by"><span>Prepared by</span><input id="preparedBy" placeholder="Your name"></label>
        <button class="btn primary" id="newDocBtn">+ New Document</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </section>
</div>
<div class="modal hidden" id="newDocModal" role="dialog" aria-modal="true" aria-labelledby="newDocTitle">
  <div class="modal-card small-modal">
    <div class="modal-head"><div><div class="eyebrow">CREATE</div><h2 id="newDocTitle">New Document</h2></div><button class="icon-btn" data-close-modal>×</button></div>
    <p class="muted">What would you like to create?</p>
    <div class="create-grid">
      <button data-create="quotation"><b>QT</b><span>Quotation</span><small>Prepare an offer</small></button>
      <button data-create="proforma"><b>PI</b><span>Proforma Invoice</span><small>Request payment</small></button>
      <button data-create="invoice"><b>INV</b><span>Invoice</span><small>Bill a customer</small></button>
      <button data-create="receipt"><b>RC</b><span>Receipt</span><small>Record a payment</small></button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden" aria-live="polite"></div>
<div id="printRoot" class="print-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./quo-base.js?v=3"></script>
<script src="./quo-data.js?v=3"></script>
<script src="./quo-editor.js?v=3"></script>
<script src="./quo-ui.js?v=3"></script>
</body>
</html>
